name = "nns_proofs"
version = "0.1.0"
keywords = ["math", "statistics", "nns"]
defaultTargets = ["NNSProofs"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
weak.linter.style.header = false # NNS is GPL, not Apache: skip the Mathlib header check

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "NNSProofs"
