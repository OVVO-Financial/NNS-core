name: Notify NNS-python

# Emitter (sending) side of the nns-core-updated contract. When an accepted
# public commit lands on NNS-core's main, dispatch nns-core-updated to
# NNS-python, carrying the native commit plus the R provenance it was
# extracted from. The receiver is expected at
# OVVO-Financial/NNS-python/.github/workflows/sync-from-nns-core.yml
# (repository_dispatch, types: [nns-core-updated]); see "Receiver contract"
# below and docs/r-source-sync.md.
#
# "Accepted" here means merged to main (via reviewed PR). To gate more narrowly,
# switch the trigger to `on: release: { types: [published] }` or
# `on: push: { tags: ['v*'] }` and use the tag SHA as core_commit.
#
# Cross-repo dispatch authority comes from the PAT (OVVO_SYNC_TOKEN, fine-grained
# with Contents: Read and write on OVVO-Financial/NNS-python), NOT from
# GITHUB_TOKEN -- so this workflow's own permissions only need contents: read.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_REPO: OVVO-Financial/NNS-python
  RECEIVER_WORKFLOW: .github/workflows/sync-from-nns-core.yml

jobs:
  notify-python:
    runs-on: ubuntu-latest

    steps:
      - name: Check out NNS-core
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect native core changes
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # NNS-python only cares about the native core. Skip docs-only / CI-only
          # pushes so they don't trigger a spurious Python sync. Diff the whole
          # push (before..after), not just HEAD^..HEAD: a multi-commit push whose
          # last commit is docs-only must still notify.
          zero="0000000000000000000000000000000000000000"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "notify=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$BEFORE_SHA" != "$zero" ] \
             && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" > changed_files.txt
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --name-only HEAD^ HEAD > changed_files.txt
          else
            git ls-files > changed_files.txt
          fi
          if grep -Eq '^(src/|include/|CMakeLists.txt|sync/nns_r_source.json)' changed_files.txt; then
            echo "notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "notify=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve R provenance carried by NNS-core
        if: steps.detect.outputs.notify == 'true'
        id: prov
        shell: bash
        run: |
          set -euo pipefail
          manifest="sync/nns_r_source.json"
          r_repo="$(jq -r '.r_repo // "OVVO-Financial/NNS"' "$manifest")"
          r_commit="$(jq -r '.r_commit' "$manifest")"
          r_version="$(jq -r '.r_version' "$manifest")"
          r_hash="$(jq -r '.r_src_tree_hash' "$manifest")"
          [[ "$r_repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::bad r_repo"; exit 1; }
          [[ "$r_commit" =~ ^[0-9a-fA-F]{7,40}$ ]] || { echo "::error::bad r_commit"; exit 1; }
          [[ "$r_version" =~ ^[0-9A-Za-z._-]{1,32}$ ]] || { echo "::error::bad r_version"; exit 1; }
          [[ "$r_hash" =~ ^[0-9a-fA-F]{0,64}$ ]] || { echo "::error::bad r_src_tree_hash"; exit 1; }
          {
            echo "r_repo=$r_repo"
            echo "r_commit=$r_commit"
            echo "r_version=$r_version"
            echo "r_src_tree_hash=$r_hash"
          } >> "$GITHUB_OUTPUT"

      # Receiver contract. GitHub silently drops a dispatch nobody listens for,
      # and NNS-python's workflow-baseline.yml deletes non-baseline workflows
      # from same-repo PRs, so check that the receiver exists.
      - name: Check that NNS-python has an nns-core-updated receiver
        if: steps.detect.outputs.notify == 'true'
        id: receiver
        env:
          TOKEN: ${{ secrets.OVVO_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "OVVO_SYNC_TOKEN not set in NNS-core; cannot notify NNS-python." >&2
            exit 1
          fi
          python3 -c "import yaml" 2>/dev/null || sudo apt-get install -y python3-yaml
          status="$(curl -sS -o receiver.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.github.com/repos/${PYTHON_REPO}/contents/${RECEIVER_WORKFLOW}")"
          # Decode to a file and parse it: a substring match accepted comments
          # and other triggers, and grep -q under pipefail could SIGPIPE base64.
          if [ "$status" = "200" ] \
             && jq -r '.content' receiver.json | base64 -d > receiver.yml 2>/dev/null \
             && python3 - receiver.yml <<'PY'
          import sys
          import yaml
          doc = yaml.safe_load(open(sys.argv[1], encoding="utf-8"))
          # YAML 1.1 loads the `on:` key as True.
          on = doc.get("on", doc.get(True)) if isinstance(doc, dict) else None
          if isinstance(on, (str, list)):
              on = {event: None for event in ([on] if isinstance(on, str) else on)}
          if not isinstance(on, dict) or "repository_dispatch" not in on:
              sys.exit(1)
          types = (on["repository_dispatch"] or {}).get("types")
          types = [types] if isinstance(types, str) else types
          sys.exit(0 if types is None or "nns-core-updated" in types else 1)
          PY
          then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            msg="${PYTHON_REPO} has no ${RECEIVER_WORKFLOW} listening for repository_dispatch type nns-core-updated (HTTP ${status}); not dispatching. Add the receiver (and list it in NNS-python's workflow-baseline.yml) to enable the core -> Python sync."
            echo "::warning::${msg}"
            echo "### NNS-python not notified" >> "$GITHUB_STEP_SUMMARY"
            echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f receiver.json receiver.yml

      - name: Dispatch nns-core-updated to NNS-python
        if: steps.detect.outputs.notify == 'true' && steps.receiver.outputs.present == 'true'
        env:
          TOKEN: ${{ secrets.OVVO_SYNC_TOKEN }}
          R_REPO: ${{ steps.prov.outputs.r_repo }}
          R_COMMIT: ${{ steps.prov.outputs.r_commit }}
          R_VERSION: ${{ steps.prov.outputs.r_version }}
          R_HASH: ${{ steps.prov.outputs.r_src_tree_hash }}
        shell: bash
        run: |
          set -euo pipefail
          # client_payload keys match exactly what NNS-python's
          # sync-from-nns-core.yml reads.
          payload=$(jq -n \
            --arg cc "${GITHUB_SHA}" \
            --arg rr "${R_REPO}" \
            --arg rc "${R_COMMIT}" \
            --arg rv "${R_VERSION}" \
            --arg rh "${R_HASH}" \
            '{event_type:"nns-core-updated",
              client_payload:{core_commit:$cc, r_repo:$rr, r_commit:$rc,
                              r_version:$rv, r_src_tree_hash:$rh}}')
          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.github.com/repos/${PYTHON_REPO}/dispatches" \
            -d "$payload"
          echo "Dispatched nns-core-updated (core ${GITHUB_SHA}) to ${PYTHON_REPO}."
